name: Publier GLM Publisher v0.5 (déploiements existants)

on:
  push:
    paths:
      - ".github/workflows/release-v0.5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glm-clasp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    # La première publication démarre uniquement avec CE message de commit précis.
    # Ensuite, ne se relance que sur demande explicite via Run workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Deploy GLM Publisher v0.5 now'
    runs-on: ubuntu-latest
    environment: apps-script
    env:
      GLM_SCRIPT_ID: ${{ vars.GLM_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les fichiers présents sur GitHub
        run: node scripts/verify-source.mjs
      - name: Préparer l'authentification du projet existant
        shell: bash
        run: |
          if [[ -z "$GLM_SCRIPT_ID" || -z "$CLASPRC_JSON" ]]; then
            echo "::error::Configurer GLM_SCRIPT_ID et CLASPRC_JSON dans GitHub."
            exit 1
          fi
          mkdir -p .clasp-stage
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "const fs=require('node:fs');fs.writeFileSync('.clasp.json', JSON.stringify({scriptId:process.env.GLM_SCRIPT_ID,rootDir:'.clasp-stage'}));"
      - name: Installer clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Lire le brouillon présent dans Google Apps Script
        # clasp pull écrit les sources Google Apps Script sous Code.js (pas Code.gs).
        run: clasp pull
      - name: Publier et vérifier les deux déploiements sans changer leurs URL
        run: node scripts/publish-existing-deployments.mjs
